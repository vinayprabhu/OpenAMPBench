<div class="notebook-intro"><p class="breadcrumb"><a href="{{ root }}notebooks/index.html">Notebooks</a> / {{ notebook.project_name }}</p><p class="eyebrow">{{ notebook.project_name }} / Jupyter notebook{% if notebook.example %} / Demonstration{% endif %}</p><h1>{{ notebook.title }}</h1><p class="intro">{{ notebook.description }}</p></div>
<div class="notebook-toolbar"><a class="button" href="{{ notebook.download }}" download>Download notebook</a>{% if notebook.colab_url %}<a class="button" href="{{ notebook.colab_url }}" target="_blank" rel="noopener">Open in Colab</a>{% endif %}<button data-toggle-code>Hide all code</button></div>
