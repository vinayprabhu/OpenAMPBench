name: Publish OpenAMPBench

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install publishing dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore notebook rendering cache
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: notebooks-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/build.py', 'templates/**', 'site.json', 'notebooks/**/*.ipynb') }}
          restore-keys: |
            notebooks-${{ runner.os }}-
      - name: Build from saved outputs
        run: python scripts/build.py
      - name: Check internal links and assets
        run: python scripts/check_site.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
